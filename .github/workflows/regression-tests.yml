name: Regression Tests

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to validate
        type: choice
        options: [all, addon, companion]
        default: all
        required: true

permissions:
  contents: read

jobs:
  addon:
    if: inputs.component == 'all' || inputs.component == 'addon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Verify historical fixture provenance
        run: bash .github/workflows/scripts/regression-addon.sh

  companion-linux:
    if: inputs.component == 'all' || inputs.component == 'companion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/companion/global.json
      - uses: actions/setup-node@v6
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: src/companion/web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Install pinned Aspire CLI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = 'aspire-cli-linux-x64-13.6.5.tar.gz'
          $install = Join-Path '${{ runner.temp }}' 'aspire'
          New-Item -ItemType Directory -Path $install -Force | Out-Null
          gh release download v13.6.5 -R microsoft/aspire -p $archive -p "$archive.sha512" -D $install
          if ($LASTEXITCODE -ne 0) { throw 'Aspire download failed' }
          $expected = (Get-Content (Join-Path $install "$archive.sha512") -Raw).Trim()
          if ((Get-FileHash (Join-Path $install $archive) -Algorithm SHA512).Hash -ne $expected) { throw 'Aspire checksum mismatch' }
          tar -xzf (Join-Path $install $archive) -C $install
          if ($LASTEXITCODE -ne 0) { throw 'Aspire extraction failed' }
          $install >> $env:GITHUB_PATH
      - name: Run Companion development and build regressions
        run: bash .github/workflows/scripts/regression-companion.sh

  companion-windows:
    if: inputs.component == 'all' || inputs.component == 'companion'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/companion/global.json
      - uses: actions/setup-node@v6
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: src/companion/web/package-lock.json
      - name: Run Windows deployment failure regressions
        shell: pwsh
        run: ./.github/workflows/scripts/regression-companion-windows.ps1
