name: Release addon

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        required: true
        type: choice
        default: minor
        options:
          - patch
          - minor
          - major
      channel:
        description: Release channel
        required: true
        type: choice
        options:
          - alpha
          - beta
          - stable

concurrency:
  group: addon-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.flavors.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require master branch
        if: github.ref != 'refs/heads/master'
        run: bash .github/workflows/scripts/release-addon.sh require-master

      - name: Resolve release channel
        id: release-inputs
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: bash .github/workflows/scripts/release-addon.sh resolve-channel

      - name: Calculate version
        id: version
        uses: Kralizek/github-actions/actions/calculate-next-version@v0.4.0
        with:
          bump: ${{ inputs.bump }}
          channel: ${{ steps.release-inputs.outputs.channel }}
          tag-prefix: addon-v

      - name: Stamp addon metadata
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: bash .github/workflows/scripts/release-addon.sh stamp

      - name: Install Lua and packaging tools
        run: sudo apt-get update && sudo apt-get install -y lua5.1 zip unzip python3-yaml

      - name: Resolve flavor matrix
        id: flavors
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 .github/workflows/scripts/resolve-flavor-matrix.py

      - name: Test and package configured flavors
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MATRIX: ${{ steps.flavors.outputs.matrix }}
        run: |
          set -euo pipefail
          matrix="$MATRIX"
          while IFS=$'\t' read -r index name interface asset; do
            suffix=''
            [[ "$name" == retail ]] || suffix="-$name"
            skip_tests=false
            [[ "$index" == 0 ]] || skip_tests=true
            ADDON_FLAVOR="$name" ARTIFACT_SUFFIX="$suffix" SKIP_TESTS="$skip_tests" \
              bash src/addon/scripts/package.sh
            [[ "$asset" == *-"$VERSION".zip ]]
            test -s "src/addon/dist/${asset%-$VERSION.zip}.zip"
          done < <(jq -r '.include | to_entries[] | [.key, .value.id, .value.interface, .value.asset] | @tsv' <<< "$matrix")

      - name: Prepare release artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/workflows/scripts/release-addon.sh rename-artifacts

      - name: Ensure GitHub release
        id: release
        uses: Kralizek/github-actions/actions/ensure-github-release@v0.5.0
        with:
          tag: ${{ steps.version.outputs.tag }}
          target: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          release-notes-start-tag: ${{ steps.version.outputs.release-notes-start-tag }}

      - name: Ensure release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: bash .github/workflows/scripts/release-addon.sh ensure-assets

  curseforge:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Download authoritative GitHub bundle and release notes
        id: authoritative
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          FLAVOR: ${{ matrix.id }}
          ASSET: ${{ matrix.asset }}
          INTERFACE: ${{ matrix.interface }}
        shell: bash
        run: bash .github/workflows/scripts/release-addon.sh download-bundle

      - name: Check CurseForge publication marker
        id: curseforge
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          FLAVOR: ${{ matrix.id }}
          GAME_VERSION: ${{ matrix.version }}
          VERSION_TYPE: ${{ matrix.curseforgeVersionType }}
          ASSET: ${{ matrix.asset }}
          BUNDLE_SHA256: ${{ steps.authoritative.outputs.digest }}
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: bash .github/workflows/scripts/release-addon.sh check-curseforge

      - name: Upload bundle to CurseForge
        id: upload
        if: steps.curseforge.outputs.skip != 'true'
        uses: Kralizek/github-actions/actions/curseforge-publish@v0.6.0
        with:
          token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          project-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          game: wow
          game-version: ${{ matrix.version }}
          game-version-type: ${{ matrix.curseforgeVersionType }}
          file: authoritative/${{ matrix.asset }}
          release-type: ${{ inputs.channel == 'stable' && 'release' || inputs.channel }}
          display-name: Artisan Logbook ${{ needs.release.outputs.version }} (${{ matrix.id }})
          changelog: ${{ steps.authoritative.outputs.notes }}
          changelog-type: markdown

      - name: Record CurseForge publication
        if: steps.curseforge.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          FLAVOR: ${{ matrix.id }}
          GAME_VERSION: ${{ matrix.version }}
          VERSION_TYPE: ${{ matrix.curseforgeVersionType }}
          RESOLVED_GAME_VERSIONS: ${{ steps.upload.outputs.game-versions }}
          PUBLISHED_FILE_ID: ${{ steps.upload.outputs.file-id }}
          ASSET: ${{ matrix.asset }}
          BUNDLE_SHA256: ${{ steps.authoritative.outputs.digest }}
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        shell: bash
        run: bash .github/workflows/scripts/release-addon.sh record-curseforge
