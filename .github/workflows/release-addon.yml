name: Release addon

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      channel:
        description: Release channel
        required: true
        type: choice
        options:
          - alpha
          - beta
          - stable

concurrency:
  group: addon-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require master branch
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Releases must be dispatched from master."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release channel
        id: release-inputs
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [[ "$CHANNEL" == "stable" ]]; then
            echo "channel=" >> "$GITHUB_OUTPUT"
          else
            echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate version
        id: version
        uses: Kralizek/github-actions/actions/calculate-next-version@v0.4.0
        with:
          bump: ${{ inputs.bump }}
          channel: ${{ steps.release-inputs.outputs.channel }}
          tag-prefix: addon-v

      - name: Stamp addon metadata
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          for toc in \
            src/addon/src/ArtisanLogbook/ArtisanLogbook.toc \
            src/addon/src/ArtisanLogbook_Core/ArtisanLogbook_Core.toc
          do
            sed -i "s/^## Version: .*/## Version: $VERSION/" "$toc"
            sed -i "s/^## X-Release-Tag: .*/## X-Release-Tag: $RELEASE_TAG/" "$toc"
            grep -Fx "## Version: $VERSION" "$toc"
            grep -Fx "## X-Release-Tag: $RELEASE_TAG" "$toc"
          done

      - name: Install Lua and packaging tools
        run: sudo apt-get update && sudo apt-get install -y lua5.1 zip unzip

      - name: Test and package
        run: bash src/addon/scripts/package.sh

      - name: Prepare release artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd src/addon/dist
          mv ArtisanLogbook_Core.zip "ArtisanLogbook_Core-$VERSION.zip"
          mv ArtisanLogbook.zip "ArtisanLogbook-$VERSION.zip"
          mv ArtisanLogbook-Bundle.zip "ArtisanLogbook-Bundle-$VERSION.zip"

      - name: Ensure GitHub release
        id: release
        uses: Kralizek/github-actions/actions/ensure-github-release@v0.5.0
        with:
          tag: ${{ steps.version.outputs.tag }}
          target: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          release-notes-start-tag: ${{ steps.version.outputs.release-notes-start-tag }}

      - name: Ensure release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            "ArtisanLogbook_Core-$VERSION.zip" \
            "ArtisanLogbook-$VERSION.zip" \
            "ArtisanLogbook-Bundle-$VERSION.zip"; do
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "Preserving existing release asset $name"
            else
              gh release upload "$TAG" "src/addon/dist/$name" --repo "$GITHUB_REPOSITORY"
            fi
          done

      - name: Download authoritative GitHub bundle and release notes
        id: authoritative
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p authoritative
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "ArtisanLogbook-Bundle-$VERSION.zip" --dir authoritative
          bundle="authoritative/ArtisanLogbook-Bundle-$VERSION.zip"
          test -s "$bundle"
          unzip -tq "$bundle"
          for addon in ArtisanLogbook ArtisanLogbook_Core; do
            unzip -p "$bundle" "$addon/$addon.toc" | grep -Fx "## X-Release-Tag: $TAG"
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > authoritative/notes.md
          digest=$(sha256sum "$bundle" | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo 'notes<<ARTISAN_RELEASE_NOTES_EOF'
            cat authoritative/notes.md
            echo 'ARTISAN_RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Resolve supported CurseForge game versions
        id: game-versions
        shell: bash
        run: |
          set -euo pipefail
          # Restrict publication to explicitly supported Retail versions.
          versions=$(ruby -ryaml -e '
            config = YAML.safe_load(File.read(".curseforge.yml"))
            supported = config.fetch("gameVersions").fetch("retail")
            abort "Retail game versions must be a nonempty list" unless supported.is_a?(Array) && !supported.empty?
            abort "Game versions must be unique" unless supported.uniq == supported
            interfaces = supported.map do |version|
              match = /\A(\d+)\.(\d+)\.(\d+)\z/.match(version)
              abort "Invalid Retail game version: #{version}" unless match
              match[1].to_i * 10000 + match[2].to_i * 100 + match[3].to_i
            end
            toc_files = %w[
              src/addon/src/ArtisanLogbook/ArtisanLogbook.toc
              src/addon/src/ArtisanLogbook_Core/ArtisanLogbook_Core.toc
            ]
            toc_files.each do |path|
              toc_interface = File.read(path)[/^## Interface: (\d+)$/, 1]
              abort "Missing Interface in #{path}" unless toc_interface
              abort "CurseForge game version does not match #{path} interface #{toc_interface}" unless interfaces.include?(toc_interface.to_i)
            end
            puts supported.join(",")
          ')
          echo "retail=$versions" >> "$GITHUB_OUTPUT"

      - name: Check CurseForge publication marker
        id: curseforge
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BUNDLE_SHA256: ${{ steps.authoritative.outputs.digest }}
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID" || { echo "::error::Missing CURSEFORGE_PROJECT_ID variable"; exit 1; }
          test -n "$API_TOKEN" || { echo "::error::Missing CURSEFORGE_API_TOKEN secret"; exit 1; }
          marker="curseforge-$VERSION.json"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$marker"; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$marker" --dir authoritative
            jq -e --arg sha "$BUNDLE_SHA256" --arg project "$PROJECT_ID" \
              '.bundleSha256 == $sha and .projectId == $project' "authoritative/$marker" >/dev/null || {
                echo "::error::CurseForge marker conflicts with current bundle or project"
                exit 1
              }
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CurseForge publication already recorded for $TAG."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No publication marker. Check CurseForge manually before retrying after an ambiguous upload failure."
          fi

      - name: Upload bundle to CurseForge
        if: steps.curseforge.outputs.skip != 'true'
        uses: itsmeow/curseforge-upload@v3.1.2
        with:
          token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          project_id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          game_endpoint: wow
          game_versions: ${{ steps.game-versions.outputs.retail }}
          file_path: authoritative/ArtisanLogbook-Bundle-${{ steps.version.outputs.version }}.zip
          release_type: ${{ inputs.channel == 'stable' && 'release' || inputs.channel }}
          display_name: Artisan Logbook ${{ steps.version.outputs.version }}
          changelog: ${{ steps.authoritative.outputs.notes }}
          changelog_type: markdown

      - name: Record CurseForge publication
        if: steps.curseforge.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BUNDLE_SHA256: ${{ steps.authoritative.outputs.digest }}
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg sha "$BUNDLE_SHA256" --arg project "$PROJECT_ID" \
            --arg tag "$TAG" \
            '{tag:$tag, projectId:$project, bundleSha256:$sha}' > "authoritative/curseforge-$VERSION.json"
          gh release upload "$TAG" "authoritative/curseforge-$VERSION.json" --repo "$GITHUB_REPOSITORY"
