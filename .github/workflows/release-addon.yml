name: Release addon

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      channel:
        description: Release channel
        required: true
        type: choice
        options:
          - alpha
          - beta
          - stable

concurrency:
  group: addon-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.game-versions.outputs.matrix }}
    steps:
      - name: Require master branch
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Releases must be dispatched from master."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release channel
        id: release-inputs
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [[ "$CHANNEL" == "stable" ]]; then
            echo "channel=" >> "$GITHUB_OUTPUT"
          else
            echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate version
        id: version
        uses: Kralizek/github-actions/actions/calculate-next-version@v0.4.0
        with:
          bump: ${{ inputs.bump }}
          channel: ${{ steps.release-inputs.outputs.channel }}
          tag-prefix: addon-v

      - name: Stamp addon metadata
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          for toc in \
            src/addon/src/ArtisanLogbook/ArtisanLogbook.toc \
            src/addon/src/ArtisanLogbook_Core/ArtisanLogbook_Core.toc
          do
            sed -i "s/^## Version: .*/## Version: $VERSION/" "$toc"
            sed -i "s/^## X-Release-Tag: .*/## X-Release-Tag: $RELEASE_TAG/" "$toc"
            grep -Fx "## Version: $VERSION" "$toc"
            grep -Fx "## X-Release-Tag: $RELEASE_TAG" "$toc"
          done

      - name: Install Lua and packaging tools
        run: sudo apt-get update && sudo apt-get install -y lua5.1 zip unzip python3-yaml

      - name: Test and package
        run: bash src/addon/scripts/package.sh

      - name: Prepare release artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd src/addon/dist
          mv ArtisanLogbook_Core.zip "ArtisanLogbook_Core-$VERSION.zip"
          mv ArtisanLogbook.zip "ArtisanLogbook-$VERSION.zip"
          mv ArtisanLogbook-Bundle.zip "ArtisanLogbook-Bundle-$VERSION.zip"

      - name: Ensure GitHub release
        id: release
        uses: Kralizek/github-actions/actions/ensure-github-release@v0.5.0
        with:
          tag: ${{ steps.version.outputs.tag }}
          target: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          release-notes-start-tag: ${{ steps.version.outputs.release-notes-start-tag }}

      - name: Ensure release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            "ArtisanLogbook_Core-$VERSION.zip" \
            "ArtisanLogbook-$VERSION.zip" \
            "ArtisanLogbook-Bundle-$VERSION.zip"; do
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "Preserving existing release asset $name"
            else
              gh release upload "$TAG" "src/addon/dist/$name" --repo "$GITHUB_REPOSITORY"
            fi
          done

      - name: Resolve CurseForge matrix
        id: game-versions
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, yaml

          rows = yaml.safe_load(open(".curseforge.yml"))["gameVersions"]
          if not isinstance(rows, list) or not rows:
              raise ValueError("gameVersions must be a nonempty array")
          names = set()
          for row in rows:
              name, version, game_id = row["name"], row["version"], row["id"]
              if not isinstance(name, str) or not re.fullmatch(r"[a-z][a-z0-9-]*", name) or name in names:
                  raise ValueError("Invalid or duplicate flavor")
              names.add(name)
              if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
                  raise ValueError("Invalid game version")
              if type(game_id) is not int or game_id <= 0:
                  raise ValueError("Game version ID must be a positive integer")
              major, minor, patch = map(int, version.split("."))
              row["interface"] = major * 10000 + minor * 100 + patch
              # The existing unqualified bundle is Retail only.
              flavor = "" if name == "retail" else f"-{name}"
              row["asset"] = f"ArtisanLogbook-Bundle{flavor}-{os.environ['VERSION']}.zip"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": rows}, separators=(",", ":")) + "\n")
          PY

  curseforge:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Download authoritative GitHub bundle and release notes
        id: authoritative
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          FLAVOR: ${{ matrix.name }}
          GAME_VERSION_ID: ${{ matrix.id }}
          ASSET: ${{ matrix.asset }}
          INTERFACE: ${{ matrix.interface }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p authoritative
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" --dir authoritative
          bundle="authoritative/$ASSET"
          test -s "$bundle"
          unzip -tq "$bundle"
          for addon in ArtisanLogbook ArtisanLogbook_Core; do
            unzip -p "$bundle" "$addon/$addon.toc" | grep -Fx "## X-Release-Tag: $TAG"
            unzip -p "$bundle" "$addon/$addon.toc" | grep -Fx "## Interface: $INTERFACE"
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > authoritative/notes.md
          digest=$(sha256sum "$bundle" | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo 'notes<<ARTISAN_RELEASE_NOTES_EOF'
            cat authoritative/notes.md
            echo 'ARTISAN_RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Check CurseForge publication marker
        id: curseforge
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          FLAVOR: ${{ matrix.name }}
          GAME_VERSION_ID: ${{ matrix.id }}
          ASSET: ${{ matrix.asset }}
          BUNDLE_SHA256: ${{ steps.authoritative.outputs.digest }}
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID" || { echo "::error::Missing CURSEFORGE_PROJECT_ID variable"; exit 1; }
          test -n "$API_TOKEN" || { echo "::error::Missing CURSEFORGE_API_TOKEN secret"; exit 1; }
          marker="curseforge-$FLAVOR-$VERSION.json"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$marker"; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$marker" --dir authoritative
            jq -e --arg sha "$BUNDLE_SHA256" --arg project "$PROJECT_ID" \
              --arg flavor "$FLAVOR" --argjson gameVersionId "$GAME_VERSION_ID" --arg asset "$ASSET" \
              '.bundleSha256 == $sha and .projectId == $project and .flavor == $flavor and .gameVersionId == $gameVersionId and .asset == $asset' "authoritative/$marker" >/dev/null || {
                echo "::error::CurseForge marker conflicts with current bundle or project"
                exit 1
              }
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CurseForge publication already recorded for $TAG."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No publication marker. Check CurseForge manually before retrying after an ambiguous upload failure."
          fi

      - name: Upload bundle to CurseForge
        if: steps.curseforge.outputs.skip != 'true'
        uses: itsmeow/curseforge-upload@v3.1.2
        with:
          token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          project_id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          game_endpoint: wow
          game_versions: ${{ matrix.id }}
          file_path: authoritative/${{ matrix.asset }}
          release_type: ${{ inputs.channel == 'stable' && 'release' || inputs.channel }}
          display_name: Artisan Logbook ${{ needs.release.outputs.version }} (${{ matrix.name }})
          changelog: ${{ steps.authoritative.outputs.notes }}
          changelog_type: markdown

      - name: Record CurseForge publication
        if: steps.curseforge.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          FLAVOR: ${{ matrix.name }}
          GAME_VERSION_ID: ${{ matrix.id }}
          ASSET: ${{ matrix.asset }}
          BUNDLE_SHA256: ${{ steps.authoritative.outputs.digest }}
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg sha "$BUNDLE_SHA256" --arg project "$PROJECT_ID" \
              --arg flavor "$FLAVOR" --argjson gameVersionId "$GAME_VERSION_ID" --arg asset "$ASSET" \
            --arg tag "$TAG" \
            '{tag:$tag, projectId:$project, flavor:$flavor, gameVersionId:$gameVersionId, asset:$asset, bundleSha256:$sha}' > "authoritative/curseforge-$FLAVOR-$VERSION.json"
          gh release upload "$TAG" "authoritative/curseforge-$FLAVOR-$VERSION.json" --repo "$GITHUB_REPOSITORY"
