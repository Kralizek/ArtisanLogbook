name: CI Companion
on:
  pull_request:
    paths:
      - "src/companion/**"
      - "src/addon/tests/fixtures/**"
      - "scripts/Deploy-Companion.ps1"
      - "scripts/tests/Deploy-Companion.Tests.ps1"
      - ".github/workflows/ci-companion.yml"
      - ".github/workflows/release-companion.yml"
      - ".github/workflows/scripts/release-companion.sh"
  push:
    branches: [master]
    paths:
      - "src/companion/**"
      - "src/addon/tests/fixtures/**"
      - "scripts/Deploy-Companion.ps1"
      - "scripts/tests/Deploy-Companion.Tests.ps1"
      - ".github/workflows/ci-companion.yml"
      - ".github/workflows/release-companion.yml"
      - ".github/workflows/scripts/release-companion.sh"
  workflow_dispatch:
concurrency:
  group: companion-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  companion:
    name: Companion (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CompanionWebDevelopment: "false"
    defaults:
      run:
        working-directory: src/companion
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/companion/global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/companion/global.json', 'src/companion/NuGet.Config', 'src/companion/Directory.Packages.props', 'src/companion/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - uses: actions/setup-node@v6
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: src/companion/web/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: dotnet restore ArtisanLogbook.Companion.slnx -p:CompanionWebDevelopment=false
      - run: dotnet build ArtisanLogbook.Companion.slnx --no-restore -c Release -p:CompanionWebDevelopment=false -warnaserror
      - run: dotnet test ArtisanLogbook.Companion.slnx --no-build -c Release -p:CompanionWebDevelopment=false --logger trx
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: companion-test-results-${{ runner.os }}
          path: src/companion/tests/**/TestResults/*.trx
          if-no-files-found: ignore
      - name: Verify .NET formatting
        if: runner.os == 'Linux'
        run: dotnet format ArtisanLogbook.Companion.slnx --verify-no-changes --no-restore
      - name: Verify frontend
        if: runner.os == 'Linux'
        working-directory: src/companion/web
        run: npm run lint && npm run format:check && npm run test && npm audit
      - name: Verify NuGet tool packaging
        if: runner.os == 'Linux'
        run: |
          dotnet pack src/Cli/Cli.csproj --no-build -c Release --output artifacts/packages
          dotnet tool install ArtisanLogbook.Companion --version 0.1.0 --add-source artifacts/packages --tool-path artifacts/tool
          ./artifacts/tool/artisanlogbook --version
      - name: Install browser
        if: runner.os == 'Linux'
        working-directory: src/companion/web
        run: npx playwright install --with-deps --only-shell chromium
      - name: Verify Linux single-executable distribution
        if: runner.os == 'Linux'
        run: |
          dotnet publish src/Cli/Cli.csproj -c Release -r linux-x64 --self-contained true -p:CompanionWebDevelopment=false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -warnaserror -o .artifacts/publish/linux-x64
          node tools/smoke-publish.mjs .artifacts/publish/linux-x64/artisanlogbook ../addon/tests/fixtures/legacy/v1-outcome1.lua
      - name: Verify Windows deployment
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CompanionWebDevelopment: "true"
        run: |
          $install = Join-Path '${{ runner.temp }}' 'ArtisanLogbookCompanion'
          & ../../scripts/Deploy-Companion.ps1 -InstallDirectory $install -NoPathUpdate
          if ($LASTEXITCODE -ne 0) { throw "Local deploy failed: $LASTEXITCODE" }
          & (Join-Path $install 'al.cmd') --version
          if ($LASTEXITCODE -ne 0) { throw 'Alias smoke test failed' }
          node tools/smoke-publish.mjs (Join-Path $install 'artisanlogbook.exe') ../addon/tests/fixtures/legacy/v1-outcome1.lua --skip-browser
          if ($LASTEXITCODE -ne 0) { throw 'Windows executable-only smoke failed' }
      - name: Verify independent publish guards
        if: runner.os == 'Linux'
        run: |
          if dotnet publish src/Cli/Cli.csproj -c Release -p:CompanionWebDevelopment=true > "$RUNNER_TEMP/companion-dev-publish.log" 2>&1; then
            echo 'Development-only publishing must fail'; exit 1
          fi
          cat "$RUNNER_TEMP/companion-dev-publish.log"
          grep -F 'Production publish cannot use CompanionWebDevelopment=true.' "$RUNNER_TEMP/companion-dev-publish.log"
          if dotnet publish src/Cli/Cli.csproj -c Release --no-build -p:CompanionWebDevelopment=false > "$RUNNER_TEMP/companion-stale-publish.log" 2>&1; then
            echo 'Publishing without current asset validation must fail'; exit 1
          fi
          cat "$RUNNER_TEMP/companion-stale-publish.log"
          grep -F 'Companion publishing requires a build to validate and embed current frontend assets.' "$RUNNER_TEMP/companion-stale-publish.log"
