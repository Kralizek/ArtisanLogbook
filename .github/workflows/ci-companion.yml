name: CI Companion
on:
  pull_request:
    paths:
      - 'src/companion/**'
      - 'scripts/deploy-companion.ps1'
      - '.github/workflows/ci-companion.yml'
  push:
    branches: [master]
    paths:
      - 'src/companion/**'
      - '.github/workflows/ci-companion.yml'
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: src/companion
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/companion/global.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: dotnet restore ArtisanLogbook.Companion.slnx
      - run: dotnet format ArtisanLogbook.Companion.slnx --verify-no-changes --no-restore
      - run: dotnet build ArtisanLogbook.Companion.slnx --no-restore -c Release -warnaserror
      - run: dotnet test tests/Core/Tests.Core.csproj --no-build -c Release
      - run: dotnet test tests/HistoryStore/Tests.HistoryStore.csproj --no-build -c Release
      - run: dotnet test tests/ImportService/Tests.ImportService.csproj --no-build -c Release
      - run: dotnet test tests/SavedVariables/Tests.SavedVariables.csproj --no-build -c Release
      - run: dotnet test tests/Cli/Tests.Cli.csproj --no-build -c Release
      - run: dotnet run --project src/Cli/Cli.csproj --no-build -c Release -- --help
      - run: dotnet run --project src/Cli/Cli.csproj --no-build -c Release -- --version
      - run: dotnet pack src/Cli/Cli.csproj --no-build -c Release --output artifacts/packages
      - run: dotnet tool install ArtisanLogbook.Companion --version 0.1.0 --add-source artifacts/packages --tool-path artifacts/tool
      - run: ./artifacts/tool/artisanlogbook --version
      - run: ./artifacts/tool/artisanlogbook import ../addon/tests/fixtures/legacy/v1-outcome1.lua --database artifacts/history.duckdb
      - run: ./artifacts/tool/artisanlogbook status --database artifacts/history.duckdb
      - name: Smoke-test Windows self-contained local deployment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ../../scripts/deploy-companion.ps1 -InstallDirectory "${{ runner.temp }}\ArtisanLogbookCompanion" -NoPathUpdate
          if ($LASTEXITCODE -ne 0) { throw "Local deploy failed: $LASTEXITCODE" }
          & "${{ runner.temp }}\ArtisanLogbookCompanion\artisanlogbook.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Installed executable smoke test failed" }
          & "${{ runner.temp }}\ArtisanLogbookCompanion\al.cmd" --help
          if ($LASTEXITCODE -ne 0) { throw "Alias smoke test failed" }

