name: Addon CI

on:
  push:
    branches:
      - master
    paths:
      - "src/addon/**"
      - ".github/workflows/ci-addon.yml"
      - ".github/workflows/release-addon.yml"
      - ".curseforge.yml"
      - ".github/workflows/scripts/**"
  pull_request:
    paths:
      - "src/addon/**"
      - ".github/workflows/ci-addon.yml"
      - ".github/workflows/release-addon.yml"
      - ".curseforge.yml"
      - ".github/workflows/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stamp development version
        shell: bash
        run: |
          version="0.0.0-dev-$(git rev-parse --short=7 HEAD)"
          for toc in src/addon/src/ArtisanLogbook/ArtisanLogbook.toc src/addon/src/ArtisanLogbook_Core/ArtisanLogbook_Core.toc; do
            test "$(grep -c '^## Version:' "$toc")" -eq 1
            sed -i "s/^## Version: .*/## Version: $version/" "$toc"
            grep -Fx "## Version: $version" "$toc"
          done
      - name: Install Lua and packaging tools
        run: sudo apt-get update && sudo apt-get install -y lua5.1 zip unzip python3-yaml
      - name: Check release shell scripts
        run: bash -n .github/workflows/scripts/*.sh

      - name: Validate CurseForge matrix
        env:
          VERSION: 0.1.0
        run: |
          set -euo pipefail
          export GITHUB_OUTPUT="$(mktemp)"
          trap 'rm -f "$GITHUB_OUTPUT"' EXIT
          python3 .github/workflows/scripts/resolve-curseforge-matrix.py
          matrix=$(sed -n 's/^matrix=//p' "$GITHUB_OUTPUT")
          jq -e '.include | length > 0' <<< "$matrix"
          jq -e '.include[] | select(.name == "retail" and .id == 16984 and .interface == 120105 and .asset == "ArtisanLogbook-Bundle-0.1.0.zip")' <<< "$matrix"

      - name: Test and package
        run: bash src/addon/scripts/package.sh
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ArtisanLogbook-addon
          path: src/addon/dist/*.zip
          if-no-files-found: error
