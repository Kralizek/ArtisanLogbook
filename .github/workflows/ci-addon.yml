name: Addon CI

on:
  push:
    branches:
      - master
    paths:
      - "src/addon/**"
      - ".github/workflows/ci-addon.yml"
      - ".github/workflows/release-addon.yml"
      - ".curseforge.yml"
      - ".github/workflows/scripts/**"
  pull_request:
    paths:
      - "src/addon/**"
      - ".github/workflows/ci-addon.yml"
      - ".github/workflows/release-addon.yml"
      - ".curseforge.yml"
      - ".github/workflows/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stamp development version
        shell: bash
        run: |
          version="0.0.0-dev-$(git rev-parse --short=7 HEAD)"
          for toc in src/addon/src/ArtisanLogbook/ArtisanLogbook.toc src/addon/src/ArtisanLogbook_Core/ArtisanLogbook_Core.toc; do
            test "$(grep -c '^## Version:' "$toc")" -eq 1
            sed -i "s/^## Version: .*/## Version: $version/" "$toc"
            grep -Fx "## Version: $version" "$toc"
          done
      - name: Install Lua and packaging tools
        run: sudo apt-get update && sudo apt-get install -y lua5.1 zip unzip python3-yaml jq
      - name: Check release shell scripts
        run: bash -n .github/workflows/scripts/*.sh

      - name: Validate CurseForge matrix
        id: game-versions
        env:
          VERSION: 0.1.0
        run: |
          set -euo pipefail
          python3 .github/workflows/scripts/resolve-curseforge-matrix.py
          matrix=$(sed -n 's/^matrix=//p' "$GITHUB_OUTPUT")
          jq -e '.include | length > 0' <<< "$matrix"
          jq -e '.include[] | select(.name == "retail" and .id == 16984 and .interface == 120105 and .asset == "ArtisanLogbook-Bundle-0.1.0.zip")' <<< "$matrix"

      - name: Test and package configured flavors
        shell: bash
        env:
          VERSION: 0.1.0
          MATRIX: ${{ steps.game-versions.outputs.matrix }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r index name interface asset; do
            suffix=''
            [[ "$name" == retail ]] || suffix="-$name"
            skip_tests=false
            [[ "$index" == 0 ]] || skip_tests=true
            ADDON_FLAVOR="$name" ARTIFACT_SUFFIX="$suffix" SKIP_TESTS="$skip_tests" \
              bash src/addon/scripts/package.sh
            [[ "$asset" == *-"$VERSION".zip ]]
            test -s "src/addon/dist/${asset%-$VERSION.zip}.zip"
          done < <(jq -r '.include | to_entries[] | [.key, .value.name, .value.interface, .value.asset] | @tsv' <<< "$MATRIX")
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ArtisanLogbook-addon
          path: src/addon/dist/*.zip
          if-no-files-found: error
