name: Addon CI

on:
  push:
    branches:
      - master
    paths:
      - "src/addon/**"
      - ".github/workflows/ci-addon.yml"
  pull_request:
    paths:
      - "src/addon/**"
      - ".github/workflows/ci-addon.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stamp development version
        shell: bash
        run: |
          version="0.0.0-dev-$(git rev-parse --short=7 HEAD)"
          for toc in src/addon/src/ArtisanLogbook/ArtisanLogbook.toc src/addon/src/ArtisanLogbook_Core/ArtisanLogbook_Core.toc; do
            test "$(grep -c '^## Version:' "$toc")" -eq 1
            sed -i "s/^## Version: .*/## Version: $version/" "$toc"
            grep -Fx "## Version: $version" "$toc"
          done
      - name: Install Lua and packaging tools
        run: sudo apt-get update && sudo apt-get install -y lua5.1 zip unzip
      - name: Test and package
        run: bash src/addon/scripts/package.sh
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ArtisanLogbook-addon
          path: src/addon/dist/*.zip
          if-no-files-found: error
