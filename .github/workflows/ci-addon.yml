name: Addon CI

on:
  push:
    branches:
      - master
    paths:
      - "src/addon/**"
      - ".github/workflows/ci-addon.yml"
  pull_request:
    paths:
      - "src/addon/**"
      - ".github/workflows/ci-addon.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua and packaging tools
        run: sudo apt-get update && sudo apt-get install -y lua5.1 zip unzip
      - name: Test and package
        run: bash src/addon/scripts/package.sh
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ArtisanLogbook-addon
          path: src/addon/dist/*.zip
          if-no-files-found: error
