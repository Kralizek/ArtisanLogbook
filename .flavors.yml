# A flavor describes a WoW client build and its packaging/release identity.
# Diagnostic flavors can be built without being eligible for release.
# CurseForge-specific settings live under metadata.curseforge.
flavors:
  - id: retail
    version: '12.1.5'
    metadata:
      curseforge:
        # CurseForge WoW Retail version-type ID (not a game-version ID).
        versionType: '517'
  - id: forever
    # Gethe/wow-ui-source 9dc84f0d3bbae1768ac3405b3716000bd93eda06:
    # version.txt = 1.60.1.70862. Confirm GetBuildInfo() on the installed client.
    version: '1.60.1'
    release: true
    metadata:
      curseforge:
        # CurseForge WoW Forever version-type ID (not a game-version ID).
        versionType: '88568'
