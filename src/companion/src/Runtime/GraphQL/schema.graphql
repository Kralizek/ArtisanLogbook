schema {
  query: Query
}

type Query {
  game(context: String!): GameContext!
  analysis(
    context: String!
    filter: CraftFilterInput
    granularity: AnalysisGranularity! = DAY
    returnItemId: ID
  ): Analysis! @cost(weight: "10")
  analysisSignature(context: String!, filter: CraftFilterInput): String!
    @cost(weight: "10")
  contextCrafts(
    context: String!
    filter: CraftFilterInput
    first: Int! = 20
    after: String
  ): CraftConnection!
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  contextCraft(context: String!, id: ID!): Craft @cost(weight: "10")
  contextRecipe(context: String!, id: ID!): Recipe @cost(weight: "10")
  contextItem(context: String!, id: ID!): Item @cost(weight: "10")
  craft(id: ID!): Craft @cost(weight: "10")
  crafts(first: Int! = 20, after: String, filter: CraftFilterInput): CraftConnection!
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  character(id: ID!): Character @cost(weight: "10")
  characters(first: Int! = 20, after: String): CharacterConnection!
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  recipe(id: ID!): Recipe @cost(weight: "10")
  recipes(first: Int! = 20, after: String, search: String): RecipeConnection!
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  profession(id: ID!): Profession @cost(weight: "10")
  professions(first: Int! = 20, after: String): ProfessionConnection!
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  item(id: ID!): Item @cost(weight: "10")
  items(first: Int! = 20, after: String, search: String): ItemConnection!
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  expansion(id: ID!): Expansion @cost(weight: "10")
  expansions(first: Int! = 20, after: String): ExpansionConnection!
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  gameContext(id: ID!): GameContext @cost(weight: "10")
  gameContexts(first: Int! = 20, after: String): GameContextConnection!
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
}

type Analysis {
  timeline: AnalysisTimeline! @cost(weight: "100")
  recipes: AnalysisRecipes! @cost(weight: "100")
  outputs: AnalysisContributions! @cost(weight: "100")
  inputs: AnalysisContributions! @cost(weight: "100")
  returns: AnalysisContributions
  characters: AnalysisContributions! @cost(weight: "100")
  qualities: AnalysisContributions! @cost(weight: "100")
  configurations: AnalysisConfigurations! @cost(weight: "100")
  itemRelations: AnalysisItemRelationsGraph @cost(weight: "100")
  signature: String!
  configurationCoverage: AnalysisEvidenceCoverage!
  inputMeasureLabel: String!
  supportsReturns: Boolean!
  attempts: AnalysisMeasure!
  metrics: AnalysisPopulationMetricsGraph!
}

type AnalysisBucket {
  start: String!
  measure: AnalysisMeasure!
}

type AnalysisConfigurationGraph {
  id: ID!
  measure: AnalysisMeasure!
  metrics: AnalysisPopulationMetricsGraph!
  evidenceAvailable: Boolean!
  evidence: RecordedConfiguration!
}

type AnalysisConfigurations {
  nodes: [AnalysisConfigurationGraph!]!
    @listSize(assumedSize: 100, requireOneSlicingArgument: false)
  truncated: Boolean!
}

type AnalysisContributionGraph {
  metrics: AnalysisPopulationMetricsGraph
  id: ID
  name: String
  blizzardId: Int
  quality: Int
  role: RecipeReagentType
  measure: AnalysisMeasure!
  finishingAllocation: AnalysisMeasure
  resourceAllocation: AnalysisMeasure
  returnedItem: AnalysisMeasure
}

type AnalysisContributions {
  nodes: [AnalysisContributionGraph!]!
    @listSize(assumedSize: 100, requireOneSlicingArgument: false)
  truncated: Boolean!
}

type AnalysisEvidenceCoverage {
  recordedAttempts: String!
  emptyAttempts: String!
  unknownAttempts: String!
}

type AnalysisItemRelationsGraph {
  outputs: AnalysisRelations!
  inputs: AnalysisRelations!
  returns: AnalysisRelations
}

type AnalysisMeasure {
  attempts: String!
  measuredAttempts: String!
  incompleteAttempts: String!
  quantity: String
}

type AnalysisOutcome {
  observedAttempts: String!
  positiveAttempts: String!
  total: String
  unknownAttempts: String!
  ineligibleAttempts: String!
}

type AnalysisPopulationMetricsGraph {
  production: AnalysisMeasure!
  ingenuity: AnalysisOutcome
  resourcefulness: AnalysisOutcome
  multicraft: AnalysisOutcome
  concentration: AnalysisOutcome
  refund: AnalysisOutcome
}

type AnalysisRecipes {
  nodes: [RecipeAnalysisGraph!]!
    @listSize(assumedSize: 100, requireOneSlicingArgument: false)
  truncated: Boolean!
}

type AnalysisRelationGraph {
  recipeId: ID
  recipeName: String
  characterId: ID!
  characterName: String
  measure: AnalysisMeasure!
}

type AnalysisRelations {
  nodes: [AnalysisRelationGraph!]!
    @listSize(assumedSize: 100, requireOneSlicingArgument: false)
  truncated: Boolean!
}

type AnalysisTimeline {
  nodes: [AnalysisBucket!]!
    @listSize(assumedSize: 100, requireOneSlicingArgument: false)
  truncated: Boolean!
}

type Character {
  activity: DimensionActivity
  crafts(first: Int! = 20, after: String): CraftConnection!
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
  id: ID!
  name: String
  classFile: String
  game: GameContext!
}

type CharacterConnection {
  nodes: [Character!]!
  pageInfo: HistoryPageInfo!
}

type Craft {
  recordedConfigurations: RecordedCraftConfigurations! @cost(weight: "100")
  character: Character!
  recipe: Recipe
  profession: Profession
  professionExpansion: Expansion
  id: ID!
  recordedAt: DateTime!
  game: GameContext!
  concentrationSpent: Int
  ingenuityRefund: Int
  appliedIngenuityRefund: Int
  concentrationCurrencyId: Int
  hasIngenuityProc: Boolean
  hasResourcefulnessProc: Boolean
  multicraftBonus: Int
  inputsComplete: Boolean
  resourcefulnessComplete: Boolean
  outputsComplete: Boolean
  reagents: [CraftReagent!]
  outputs: [CraftOutput!]
}

type CraftConnection {
  nodes: [Craft!]!
  pageInfo: HistoryPageInfo!
}

type CraftOutput {
  item: Item!
  quality: Int
  quantity: Long
  quantityExact: String
}

type CraftReagent {
  item: Item!
  allocatedQuantity: Long
  allocatedQuantityExact: String
  returnedQuantity: Decimal
  returnedQuantityExact: String
}

type DimensionActivity {
  craftCount: String!
  lastRecordedAt: DateTime!
}

type Expansion {
  recipes(first: Int! = 20, after: String, search: String): RecipeConnection!
    @cost(weight: "1000")
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
  crafts(first: Int! = 20, after: String): CraftConnection!
    @cost(weight: "1000")
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
  id: ID!
  key: String!
  name: String
  game: GameContext!
}

type ExpansionConnection {
  nodes: [Expansion!]!
  pageInfo: HistoryPageInfo!
}

type GameContext {
  expansionGroups: GameExpansionGroups! @cost(weight: "1000")
  recipesByBlizzardIds(ids: [Int!]!): [Recipe!]!
    @cost(weight: "100")
    @listSize(assumedSize: 100, requireOneSlicingArgument: false)
  itemsByBlizzardIds(ids: [Int!]!): [Item!]!
    @cost(weight: "100")
    @listSize(assumedSize: 100, requireOneSlicingArgument: false)
  characters(first: Int! = 20, after: String): CharacterConnection!
    @cost(weight: "1000")
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
  professions(first: Int! = 20, after: String): ProfessionConnection!
    @cost(weight: "1000")
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
  recipes(
    first: Int! = 20
    after: String
    search: String
    profession: ID
    craftedOnly: Boolean! = false
  ): RecipeConnection!
    @cost(weight: "1000")
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
  expansions(first: Int! = 20, after: String): ExpansionConnection!
    @cost(weight: "1000")
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
  items(first: Int! = 20, after: String, search: String): ItemConnection!
    @cost(weight: "1000")
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
  crafts(first: Int! = 20, after: String): CraftConnection!
    @cost(weight: "1000")
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
  id: ID!
  canonicalId: String!
  routeAlias: String!
  displayName: String!
  project: Int!
  progressionTrack: String
}

type GameContextConnection {
  nodes: [GameContext!]!
  pageInfo: HistoryPageInfo!
}

type GameExpansionGroup {
  id: ID!
  key: String!
  name: String
  game: GameContext!
  professionExpansionKeys: [String!]!
}

type GameExpansionGroups {
  nodes: [GameExpansionGroup!]!
    @listSize(assumedSize: 100, requireOneSlicingArgument: false)
  truncated: Boolean!
}

type HistoryPageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Item {
  consumingCrafts(first: Int! = 20, after: String): CraftConnection!
    @cost(weight: "1000")
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
  producingCrafts(first: Int! = 20, after: String): CraftConnection!
    @cost(weight: "1000")
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
  id: ID!
  blizzardId: Int!
  name: String
  quality: Int
  game: GameContext!
}

type ItemConnection {
  nodes: [Item!]!
  pageInfo: HistoryPageInfo!
}

type Profession {
  activity: DimensionActivity
  parent: Profession
  children(first: Int! = 20, after: String): ProfessionConnection!
    @cost(weight: "1000")
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
  recipes(first: Int! = 20, after: String, search: String): RecipeConnection!
    @cost(weight: "1000")
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
  crafts(first: Int! = 20, after: String): CraftConnection!
    @cost(weight: "1000")
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
  id: ID!
  blizzardId: Int!
  name: String
  game: GameContext!
}

type ProfessionConnection {
  nodes: [Profession!]!
  pageInfo: HistoryPageInfo!
}

type Recipe {
  activity: DimensionActivity
  profession: Profession
  expansion: Expansion
  reagentSlots: [RecipeReagentSlot!]!
  crafts(first: Int! = 20, after: String): CraftConnection!
    @listSize(
      slicingArguments: ["first"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "1000")
  id: ID!
  blizzardId: Int!
  name: String
  maxQuality: Int
  game: GameContext!
}

type RecipeAnalysisGraph {
  id: ID!
  name: String
  outputs: AnalysisMeasure!
  ingenuity: AnalysisOutcome
  resourcefulness: AnalysisOutcome
  multicraft: AnalysisOutcome
  concentration: AnalysisOutcome
  refund: AnalysisOutcome
}

type RecipeConnection {
  nodes: [Recipe!]!
  pageInfo: HistoryPageInfo!
}

type RecipeReagentSlot {
  recipe: Recipe!
  candidateItems: [Item!]
  id: ID!
  dataSlotType: RecipeReagentDataSlotType
  dataSlotIndex: Int!
  slotIndex: Int
  reagentType: RecipeReagentType
  isRequired: Boolean
  requiredQuantity: Int
}

type RecordedBuff {
  spellId: Int
  applications: Int
}

type RecordedConfiguration {
  scope: String
  statsCoverage: String
  equipmentCoverage: String
  buffsCoverage: String
  finishingCoverage: String
  useConcentration: Boolean
  statistics: [RecordedStatistic!]
  equipment: [RecordedEquipment!]
  buffs: [RecordedBuff!]
  finishingReagents: [RecordedFinishingReagent!]
  equipmentTruncated: Boolean!
  buffsTruncated: Boolean!
  finishingReagentsTruncated: Boolean!
}

type RecordedCraftConfiguration {
  id: ID!
  evidenceAvailable: Boolean!
  evidence: RecordedConfiguration!
}

type RecordedCraftConfigurations {
  observed: Boolean!
  nodes: [RecordedCraftConfiguration!]!
    @listSize(assumedSize: 100, requireOneSlicingArgument: false)
  truncated: Boolean!
}

type RecordedEquipment {
  slot: Int
  itemId: Int
  empty: Boolean
}

type RecordedFinishingReagent {
  itemId: Int
  quantity: Int
}

type RecordedStatistic {
  label: String!
  value: String!
}

input CraftFilterInput {
  gameId: ID
  characterId: ID
  recipeId: ID
  professionId: ID
  expansionId: ID
  from: DateTime
  to: DateTime
  inputItemId: ID
  outputItemId: ID
  returnedItemId: ID
  itemId: ID
  configurationId: ID
  buffSpellId: Int
  finishingItemId: ID
  absentBuffSpellId: Int
  absentFinishingItemId: ID
  absentInputItemId: ID
  gameExpansionId: ID
}

enum AnalysisGranularity {
  DAY
  WEEK
  MONTH
}

enum RecipeReagentDataSlotType {
  REAGENT
  MODIFIED_REAGENT
}

enum RecipeReagentType {
  MODIFYING
  BASIC
  FINISHING
  AUTOMATIC
}

"The `DateTime` scalar type represents a date and time with time zone offset information."
scalar DateTime
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/date-time.html")

"The `Decimal` scalar type represents a decimal floating-point number with high precision."
scalar Decimal
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/decimal.html")

"The `Long` scalar type represents a signed 64-bit integer."
scalar Long
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/long.html")

"The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response."
directive @cost(
  "The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc."
  weight: String!
) on
  | SCALAR
  | OBJECT
  | FIELD_DEFINITION
  | ARGUMENT_DEFINITION
  | ENUM
  | INPUT_FIELD_DEFINITION

"The purpose of the `@listSize` directive is to either inform the static analysis about the size of returned lists (if that information is statically available), or to point the analysis to where to find that information."
directive @listSize(
  "The `assumedSize` argument can be used to statically define the maximum length of a list returned by a field."
  assumedSize: Int
  "The `slicingArguments` argument can be used to define which of the field's arguments with numeric type are slicing arguments, so that their value determines the size of the list returned by that field. It may specify a list of multiple slicing arguments."
  slicingArguments: [String!]
  "The `slicingArgumentDefaultValue` argument can be used to define a default value for a slicing argument, which is used if the argument is not present in a query."
  slicingArgumentDefaultValue: Int
  "The `sizedFields` argument can be used to define that the value of the `assumedSize` argument or of a slicing argument does not affect the size of a list returned by a field itself, but that of a list returned by one of its sub-fields."
  sizedFields: [String!]
  "The `requireOneSlicingArgument` argument can be used to inform the static analysis that it should expect that exactly one of the defined slicing arguments is present in a query. If that is not the case (i.e., if none or multiple slicing arguments are present), the static analysis may throw an error."
  requireOneSlicingArgument: Boolean = true
) on FIELD_DEFINITION