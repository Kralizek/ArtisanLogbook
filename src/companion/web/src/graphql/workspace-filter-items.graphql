query WorkspaceFilterItems($context: String!, $search: String!) {
  game(context: $context) {
    items(first: 50, search: $search) {
      nodes {
        id
        name
        blizzardId
        quality
      }
      pageInfo {
        hasNextPage
      }
    }
  }
}

query WorkspaceSelectedItem($context: String!, $id: ID!) {
  contextItem(context: $context, id: $id) {
    id
    name
    blizzardId
    quality
  }
}
